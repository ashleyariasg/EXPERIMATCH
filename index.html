<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExperiMatch - Encuentra Tu Experiencia Ideal</title>
  <style>
    /* --- ESTILOS GENERALES Y DISEÑO --- */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --dark: #0f172a;
      --light: #f8fafc;
      --gray: #64748b;
      --admin-badge: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--light); color: var(--dark); padding-bottom: 50px; }

    /* HEADER / NAVBAR */
    header {
      background-color: var(--dark);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .logo h1 { font-size: 1.6rem; color: #38bdf8; letter-spacing: 0.5px; }
    .user-panel { display: flex; align-items: center; gap: 15px; }
    .btn-login {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-login:hover { background-color: var(--primary-hover); }

    /* SECCIÓN HERO */
    .hero {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(to right, #1e293b, #0f172a);
      color: white;
    }
    .hero h2 { font-size: 2.2rem; margin-bottom: 10px; }
    .search-bar {
      margin-top: 20px;
      max-width: 550px;
      margin-left: auto;
      margin-right: auto;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: none;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* CONTENEDOR DE LUGARES */
    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    .grid-lugares {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 25px;
    }

    /* TARJETAS DE LUGARES */
    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { 
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 8px; color: var(--dark); }
    .card-tag {
      align-self: flex-start;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .card-desc { font-size: 0.9rem; color: var(--gray); line-height: 1.4; }

    /* MODAL DE REGISTRO / LOGIN */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 { margin-bottom: 15px; }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .modal-content button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn {
      float: right;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* BADGES Y PANEL DE ADMIN */
    .badge-admin { background: var(--admin-badge); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    .badge-user { background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    .admin-panel-secret {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- HEADER CON NOMBRE ACTUALIZADO -->
  <header>
    <div class="logo">
      <h1 id="nombre-pagina">ExperiMatch</h1>
    </div>
    <div class="user-panel">
      <div id="user-info"></div>
      <button class="btn-login" id="btn-modal" onclick="abrirModal()">Iniciar Sesión / Registro</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero">
    <h2>Haz Match con tu próxima experiencia</h2>
    <p>Explora destinos, gastronomía, aventura, eventos culturales y mucho más.</p>
    <div class="search-bar">
      <input type="text" id="buscador" placeholder="Buscar por lugar o etiqueta (ej. Aventura, Relax, Café)..." onkeyup="filtrarLugares()">
    </div>
  </section>

  <!-- PANEL SOLO VISIBLE PARA LOS 3 ADMINISTRADORES -->
  <div class="container">
    <div id="panel-admin" class="admin-panel-secret">
      <h3>👑 Modo Administrador Activado</h3>
      <p>Bienvenido/a al panel de control exclusivo de <b>ExperiMatch</b>.</p>
    </div>
  </div>

  <!-- CATÁLOGO DE LUGARES -->
  <div class="container">
    <div class="grid-lugares" id="contenedor-lugares">
      <!-- Generado dinámicamente -->
    </div>
  </div>

  <!-- MODAL DE AUTENTICACIÓN -->
  <div class="modal" id="modal-auth">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h3>Acceso / Registro</h3>
      <p style="font-size: 0.85rem; color: var(--gray); margin-bottom: 15px;">
        Ingresa con tu correo registrado para verificar tus permisos.
      </p>
      <input type="text" id="input-nombre" placeholder="Tu Nombre">
      <input type="email" id="input-email" placeholder="correo@ejemplo.com">
      <button onclick="autenticarUsuario()">Ingresar</button>
    </div>
  </div>

  <!-- LÓGICA EN JAVASCRIPT -->
  <script>
    // 1. CORREOS DE LOS 3 ADMINISTRADORES
    const CORREOS_ADMINISTRADORES = [
      "gabrielaurbanof2609@gmail.com",
      "ashleyvgarcia07@gmail.com",
      "samuelramirezhenao6@gmail.com"
    ];

    // 2. BASE DE DATOS DE LUGARES CON DIVERSIDAD DE ETIQUETAS
    const listaLugares = [
      {
        id: 1,
        nombre: "Ruta de Cascadas y Rafting",
        categoria: "Aventura",
        descripcion: "Descenso en río de aguas rápidas y caminata ecológica hacia caídas de agua naturales.",

      },
      {
        id: 2,
        nombre: "Bistro & Terraza Gourmet",
        categoria: "Gastronomía",
        descripcion: "Platos de autor con cocina de fusión internacional y coctelería artesanal.",
        imagen: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500"
      },
      {
        id: 3,
        nombre: "Teatro & Galería de Arte",
        categoria: "Cultura",
        descripcion: "Exposiciones pictóricas contemporáneas y obras teatrales independientes.",

      },

        descripcion: "Bar en azotea con vista panorámica, DJs en vivo y ambiente exclusivo.",
        imagen: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500"
      },
      {
        id: 5,
        nombre: "Reserva de Bosque Nuboso",
        categoria: "Naturaleza",
        descripcion: "Senderismo guiado entre flora silvestre, mariposarios y avistamiento de aves.",
        imagen: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=500"
      },
      {
        id: 6,
        nombre: "Spa & Termales del Valle",
        categoria: "Relax",
        descripcion: "Piscinas de agua termal natural, circuito de saunas y masajes de relajación.",
        imagen: "https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=500"
      },
      {
        id: 7,
        nombre: "Barista Lab & Café Specialty",
        categoria: "Cafetería",
        descripcion: "Catas de café de origen, repostería fina artesanal y espacio para cowork.",
        imagen: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=500"

      {

      {

        imagen: "https://images.unsplash.com/photo-1592478411213-6153e4ebc07d?w=500"

      {

        nombre: "Playa Encantada & Glamping",
        categoria: "Alojamiento",
        descripcion: "Hospedaje ecológico frente al mar con fogatas nocturnas y paseos en kayak.",
        imagen: "https://images.unsplash.com/photo-1499793983690-e29da59ef1c2?w=500"
      },
      {
        id: 12,
        nombre: "Observatorio Astronómico",
        categoria: "Ciencia",
        descripcion: "Noches de observación de estrellas, planetas y telescopios de alta potencia.",
        imagen: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=500"
      },
      {
        id: 13,
        nombre: "Parque Acuático Aventura",
        categoria: "Familiar",
        descripcion: "Toboganes gigantes, piscina de olas y atracciones para todas las edades.",

      },
      {
        id: 14,
        nombre: "Mercado de Antigüedades",
        categoria: "Shopping",
        descripcion: "Coleccionables vintage, libros antiguos, discos de vinilo y curiosidades.",
        imagen: "https://images.unsplash.com/photo-1531058020387-3be344556be6?w=500"
      },
      {
        id: 15,
        nombre: "Jardín Botánico & Orquideario",
        categoria: "Ecoturismo",
        descripcion: "Invernaderos con especies tropicales y senderos rodeados de naturaleza pura.",
        imagen: "https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=500"
      },
      {
        id: 16,
        nombre: "Arena de Conciertos Live",
        categoria: "Música",
        descripcion: "Escenario principal para festivales musicales, recitales y espectáculos masivos.",
        imagen: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500"
      }
    ];

    // 3. RENDERIZADO DE LUGARES
    function mostrarLugares(lugares) {
      const contenedor = document.getElementById("contenedor-lugares");
      contenedor.innerHTML = "";

      lugares.forEach(lugar => {
        const tarjeta = document.createElement("div");
        tarjeta.className = "card";
        tarjeta.innerHTML = `
          <img src="${lugar.imagen}" alt="${lugar.nombre}">
          <div class="card-body">
            <span class="card-tag">${lugar.categoria}</span>
            <div class="card-title">${lugar.nombre}</div>
            <p class="card-desc">${lugar.descripcion}</p>
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    // 4. BÚSQUEDA Y FILTRADO POR TEXTO O ETIQUETA
    function filtrarLugares() {
      const texto = document.getElementById("buscador").value.toLowerCase();
      const lugaresFiltrados = listaLugares.filter(lugar => 
        lugar.nombre.toLowerCase().includes(texto) || 
        lugar.categoria.toLowerCase().includes(texto) ||
        lugar.descripcion.toLowerCase().includes(texto)
      );
      mostrarLugares(lugaresFiltrados);
    }

    // 5. CONTROL DEL MODAL DE AUTENTICACIÓN
    function abrirModal() { document.getElementById("modal-auth").style.display = "flex"; }
    function cerrarModal() { document.getElementById("modal-auth").style.display = "none"; }

    // 6. VALIDACIÓN DE PERMISOS DE ADMINISTRADOR
    function autenticarUsuario() {
      const nombre = document.getElementById("input-nombre").value.trim();
      const email = document.getElementById("input-email").value.trim().toLowerCase();

      if (!nombre || !email) {
        alert("Por favor completa tu nombre y correo electrónico.");
        return;
      }

      const userInfo = document.getElementById("user-info");
      const adminPanel = document.getElementById("panel-admin");
      const btnModal = document.getElementById("btn-modal");

      // Verificación estricta contra la lista de 3 administradores
      const esAdmin = CORREOS_ADMINISTRADORES.includes(email);

      if (esAdmin) {
        userInfo.innerHTML = `Hola, <b>${nombre}</b> <span class="badge-admin">Admin ExperiMatch</span>`;
        adminPanel.style.display = "block";
      } else {
        userInfo.innerHTML = `Hola, <b>${nombre}</b> <span class="badge-user">Usuario</span>`;
        adminPanel.style.display = "none";
      }

      btnModal.innerText = "Cerrar Sesión";
      btnModal.onclick = cerrarSesion;
      cerrarModal();
    }

    function cerrarSesion() {
      document.getElementById("user-info").innerHTML = "";
      document.getElementById("panel-admin").style.display = "none";
      const btnModal = document.getElementById("btn-modal");
      btnModal.innerText = "Iniciar Sesión / Registro";
      btnModal.onclick = abrirModal;
    }

    // Cargar catálogo inicial al abrir la página
    mostrarLugares(listaLugares);
  </script>
</body>
</html>
